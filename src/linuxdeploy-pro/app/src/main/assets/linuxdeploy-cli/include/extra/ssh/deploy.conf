NAME="ssh"
DESC="Secure shell (SSH) server"
PARAMS="DISTRIB"
# 依赖初始化系统：sshd 的启动方式因发行版而异，且都依赖 init 组件——
# Debian 系靠 SysV（/etc/rcN.d 的 S 脚本）、Alpine 靠 OpenRC（rc-update）、
# Arch/Slackware 靠 /etc/rc.d 脚本（run-parts）、systemctl 模式靠 init 拉起
# ssh.service。早期只声明 DEPENDS="extra"，配置里 INCLUDE 未写 init 时
# 初始化系统不进执行计划：部署时 sshd 正常安装、容器也“运行中”，
# 但启动阶段没人拉起 sshd，表现为 22 端口连不上。
# 注意：init 是参数化父组件（真正执行 init/${INIT}），由 cli.sh 的
# component_depends 解析为当前参数对应的子组件。
DEPENDS="extra init"
