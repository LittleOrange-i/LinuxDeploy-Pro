NAME="bootstrap"
DESC="Installer of Linux distibution"
# 注意：DEPENDS 不可引用 ${DISTRIB} 之类变量——组件 conf 经参数化解析
# （不经 eval），值内变量永远不会展开，会被当成字面目录名静默跳过
# （曾导致 bootstrap/ubuntu 从不安装、rootfs 为空）。
# 发行版引导组件（bootstrap/ubuntu、bootstrap/debian 等）由 deploy 流程
# 在调用 component_exec 时按 DISTRIB 显式传入（见 cli.sh deploy 分支）。
# bootstrap/rootfs 组件已移除，不再引用。
DEPENDS="core"
PARAMS="DISTRIB"
