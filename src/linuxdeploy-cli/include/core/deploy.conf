NAME="core"
DESC="Core components"
# 部署顺序约束：core 下的账号/主机名/时区等配置都直接改写 rootfs 里的
# /etc/passwd、/etc/shadow 等文件，必须先由 bootstrap 把 rootfs 安装出来。
# 这里依赖抽象的 bootstrap（而非 bootstrap/${DISTRIB}）：conf 值不经 eval 展开，
# 且兜底依赖本身就是该目录，递归解析时会被安全跳过（防循环），
# 因此部署计划中 core/* 会排在 bootstrap/${DISTRIB} 之后执行。
DEPENDS="bootstrap core/ldstatus core/emulator core/motd core/hosts core/hostname core/mnt core/net core/timezone core/su core/locale core/aid core/profile core/sudo core/unchroot"
